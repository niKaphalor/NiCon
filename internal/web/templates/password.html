{{define "content"}}
<h1>RCON password — {{.Server.Name}}</h1>
<p class="hint">{{.Server.Host}}:{{.Server.Port}}</p>
<form method="post" action="/servers/{{.Server.ID}}/password" class="form">
  <label>RCON password<input type="password" name="password" required></label>
  <button type="submit">Save</button>
</form>
{{end}}
