{{define "content"}}
<h1>Nitrado account</h1>
<p class="hint">The API token is stored locally in NiCon's database, unencrypted. RCON passwords for Nitrado-discovered servers must still be entered manually — Nitrado's API doesn't expose them.</p>

<form method="post" action="/nitrado/token" class="form">
  <label>API token<input type="password" name="token" placeholder="paste your Nitrado API token"></label>
  <button type="submit">Save token</button>
</form>

{{if .HasToken}}
<form method="post" action="/nitrado/sync">
  <button type="submit">Sync servers</button>
</form>
{{end}}
{{end}}
