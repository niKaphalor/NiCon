name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, vet, format, test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: nicon_test
          MARIADB_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pci_test_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=40s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        env:
          NICON_TEST_DB_DSN: root:ci_test_root_password@tcp(127.0.0.1:3306)/nicon_test?parseTime=true
        run: go test ./...
