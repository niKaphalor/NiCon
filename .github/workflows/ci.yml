name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, vet, format, test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
        env:
          MARIADB_DATABASE: nicon_test
          MARIADB_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The repository root and docs/ (GitHub Pages) keep several files
      # byte-identical by hand — nothing enforced that before this step,
      # relying purely on remembering to `cp` after every edit. That
      # already silently drifted at least once during development (caught
      # by chance, not by any check) before this step existed. A
      # deliberate one-way difference (root vs. docs diverging on
      # purpose) would need to update this list too, not just be
      # surprised by a red build.
      - name: Check root/docs mirrored files stay identical
        run: |
          status=0
          for f in app.js index.html games.js style.css sw.js compatibility.md i18n.en.js i18n.de.js i18n.js; do
            if ! diff -q "$f" "docs/$f" > /dev/null 2>&1; then
              echo "::error file=$f::$f and docs/$f have drifted apart — keep them byte-identical (e.g. \`cp $f docs/$f\`)"
              status=1
            fi
          done
          exit $status

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Bumped from 1.22: govulncheck was flagging ~30 findings every
          # single run, all of them fixed-upstream Go stdlib CVEs (net/http,
          # crypto/tls, net/url, ...) tied to building with an old toolchain
          # — none were about this repo's own code or its dependencies. On a
          # current patch release those findings go away on their own, so
          # the check starts actually meaning something again. go.mod's own
          # `go 1.23` directive is the floor; setup-go still resolves the
          # latest 1.26.x patch here.
          go-version: "1.26"

      # No Docker health-cmd on the service above: mariadb's own
      # mysqladmin-based health check (run via `docker exec` inside the
      # service container) reported unhealthy well past 90s in practice
      # even though the server logs showed it accepting connections
      # within a few seconds — some auth/exec quirk specific to that
      # in-container mechanism on the Actions runner, not worth chasing
      # further. A plain TCP-readiness loop was tried as a substitute,
      # but that's not actually reliable either: mariadb binds :3306 very
      # early, well before its internal init (system tables, the
      # nicon_test database, the root password) has finished — a bare
      # TCP connect succeeds in well under a second while the server is
      # still busy initializing, and every real connection attempt
      # during that window fails with a driver-level "bad connection" /
      # "unexpected EOF" (confirmed: every single test failed this way
      # in CI, not just new ones, so this was never about the code under
      # test). mysqladmin ping does a real MySQL-protocol handshake
      # (including auth), so it can't return healthy before the server
      # actually is — that's what the driver itself will do a moment
      # later, so this loop and the real test connections wait on
      # exactly the same condition. Installed locally on the runner and
      # connecting over the mapped port from outside, not via `docker
      # exec` into the container, so this isn't a repeat of the
      # Docker-health-cmd issue above.
      - name: Wait for MariaDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-client
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot -pci_test_root_password --silent 2>/dev/null; then
              echo "MariaDB is accepting real connections."
              exit 0
            fi
            echo "waiting for MariaDB ($i/30)..."
            sleep 2
          done
          echo "MariaDB never became ready" >&2
          exit 1

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        env:
          NICON_TEST_DB_DSN: root:ci_test_root_password@tcp(127.0.0.1:3306)/nicon_test?parseTime=true
        run: go test ./...

      # Merge-blocking. govulncheck exits non-zero only for vulnerabilities
      # the code can actually reach (it stays green for advisories that
      # merely touch a required module or package), so a red build here is
      # a real signal: bump the dependency/toolchain, or, if there is no fix
      # yet, consciously decide what to do rather than merging past it. The
      # tool version is pinned (Dependabot-independent, bump it by hand
      # occasionally); the vulnerability database it queries is always
      # current, so new advisories are still caught.
      - name: Check for known vulnerabilities (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Lint webspace/ PHP (syntax only)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"

      - name: php -l on every webspace/ file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find webspace -name '*.php' -print0)
          exit $status

      - name: PHP API integration tests
        env:
          NICON_PHP_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=nicon_test;charset=utf8mb4
          NICON_PHP_TEST_DB_USER: root
          NICON_PHP_TEST_DB_PASS: ci_test_root_password
        run: php tests/php/api_integration.php

  # go.mod's `go` directive is the supported floor; the main job builds
  # with the current toolchain. Building and vetting with exactly the floor
  # version catches use of newer stdlib APIs. DB-backed tests skip without
  # NICON_TEST_DB_DSN, so no database service is needed here.
  go-min-version:
    name: Build and test on the minimum Go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # The relay image is what actually gets deployed, and .dockerignore is an
  # allowlist: a new root-level .go file once went missing from the build
  # context, which no other job noticed (`go build` on the checkout is fine).
  docker-build:
    name: Build the relay Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build
        run: docker build -t nicon-relay:ci .

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser
