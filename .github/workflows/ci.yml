name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, vet, format, test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: nicon_test
          MARIADB_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Bumped from 1.22: govulncheck was flagging ~30 findings every
          # single run, all of them fixed-upstream Go stdlib CVEs (net/http,
          # crypto/tls, net/url, ...) tied to building with an old toolchain
          # — none were about this repo's own code or its dependencies. On a
          # current patch release those findings go away on their own, so
          # the check starts actually meaning something again. go.mod's own
          # `go 1.23` directive is the floor; setup-go still resolves the
          # latest 1.26.x patch here.
          go-version: "1.26"

      # No Docker health-cmd on the service above: mariadb's own
      # mysqladmin-based health check reported unhealthy well past 90s in
      # practice even though the server logs showed it accepting
      # connections within a few seconds — some auth/exec quirk specific
      # to this image on the Actions runner, not worth chasing further.
      # A plain TCP-readiness loop is a reliable enough substitute: the
      # real server only binds :3306 after its (fast) first-run init
      # completes, so a successful connect here means it's actually ready.
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/3306) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "MariaDB is accepting connections."
              exit 0
            fi
            echo "waiting for MariaDB ($i/30)..."
            sleep 2
          done
          echo "MariaDB never became reachable on :3306" >&2
          exit 1

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        env:
          NICON_TEST_DB_DSN: root:ci_test_root_password@tcp(127.0.0.1:3306)/nicon_test?parseTime=true
        run: go test ./...

      # Best-effort, not a hard gate: a new advisory can land in a
      # dependency at any time, independent of any code change here, so a
      # red X on an unrelated PR would be confusing noise rather than a
      # signal to act on immediately. It still shows up in the log for
      # whoever's looking.
      - name: Check for known vulnerabilities (govulncheck)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Lint webspace/ PHP (syntax only)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: php -l on every webspace/ file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find webspace -name '*.php' -print0)
          exit $status
