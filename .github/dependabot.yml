version: 2
updates:
  # Go modules (go.mod / go.sum)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Browser-test tooling (Playwright). Its browsers are installed by CI, so
  # a bump is verified by the Browser end-to-end job on the PR itself.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Actions are pinned to commit SHAs; Dependabot updates SHA and comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
