  <nav class="public-nav" aria-label="Rechtliches und Support">

<main class="legal-page">
  <div class="legal-page-toolbar"><a href="index.html" class="back-link link-button">← Zurück zu NiCon</a><nav class="lang-switch" aria-label="Sprache">
    <a href="contact.html" lang="en" hreflang="en">EN</a>
    <span aria-hidden="true">·</span>
    <a href="contact.de.html" lang="de" hreflang="de" aria-current="page">DE</a>
  </nav></div>
  <article class="legal-card contact-card">
  <span class="page-eyebrow">Support</span>
  <h1>Kontakt</h1>
  <p class="hint">
    Fragen, Fehlermeldungen oder alles andere rund um diese NiCon-Instanz —
    einfach hier senden, es geht direkt an den Betreiber.
  </p>

  <form id="contact-form" class="stacked-form">
    <input type="text" name="website" class="honeypot-field" tabindex="-1" autocomplete="off" aria-hidden="true">
    <input id="contact-name" type="text" placeholder="Ihr Name" required autocomplete="name" aria-label="Ihr Name">
    <input id="contact-email" type="email" placeholder="Ihre E-Mail-Adresse" required autocomplete="email" aria-label="Ihre E-Mail-Adresse">
    <textarea id="contact-message" placeholder="Nachricht" required aria-label="Nachricht"></textarea>
    <button type="submit" class="btn-primary">Nachricht senden</button>
  </form>
  <p id="contact-status" class="hint form-status" hidden></p>
  </article>
</main>
